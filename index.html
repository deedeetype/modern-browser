<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background: transparent !important; margin: 0; overflow: hidden; }
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        width: 250px;
        height: 100vh;
        background: rgba(24, 24, 27, 0.9);
        backdrop-filter: blur(20px);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 100;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        padding: 1rem;
      }
      #browser-view {
        position: absolute;
        left: 250px;
        top: 0;
        width: calc(100vw - 250px);
        height: 100vh;
        border: none;
        z-index: 1;
      }
    </style>
    <title>Modern Browser</title>
  </head>
  <body>
    <!-- L'UI en HTML PUR (SANS REACT) -->
    <div class="sidebar">
      <div class="flex space-x-2 mb-6">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div className="w-3 h-3 rounded-full bg-green-500"></div>
      </div>

      <div class="relative mb-6">
        <input id="url-input" type="text" placeholder="Search or go to..." 
               class="w-full bg-white/10 border border-white/10 rounded-lg py-2 px-4 text-sm outline-none focus:ring-2 ring-blue-500/50 text-white">
      </div>

      <nav class="flex-1 space-y-2">
        <div class="p-2 hover:bg-white/10 rounded-lg cursor-pointer transition-all flex justify-between items-center group">
          <span class="text-sm text-white/70 group-hover:text-white">Spaces</span>
          <span class="text-white/20">➔</span>
        </div>
        <div class="p-2 hover:bg-white/10 rounded-lg cursor-pointer transition-all flex justify-between items-center group">
          <span class="text-sm text-white/70 group-hover:text-white">Profiles</span>
          <span class="text-white/20">➔</span>
        </div>
        <div class="p-2 hover:bg-white/10 rounded-lg cursor-pointer transition-all flex justify-between items-center group">
          <span class="text-sm text-white/70 group-hover:text-white">Settings</span>
          <span class="text-white/20">➔</span>
        </div>
      </nav>

      <div class="p-2 bg-white/5 rounded-xl text-[10px] text-white/40 text-center">
        Modern Browser v1.0
      </div>
    </div>

    <!-- Le Moteur -->
    <webview id="browser-view" src="https://www.google.com"></webview>

    <script>
      const input = document.getElementById('url-input');
      const wv = document.getElementById('browser-view');

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          let url = input.value;
          if (!url.startsWith('http')) {
            url = 'https://' + url;
          }
          wv.src = url;
          input.value = '';
        }
      });
    </script>
  </body>
</html>
