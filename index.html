<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body { background: transparent !important; margin: 0; overflow: hidden; }
    </style>
    <title>Modern Browser</title>
  </head>
  <body class="bg-transparent">
    <!-- LE MOTEUR : Positionné en arrière-plan -->
    <webview id="browser-view" src="https://www.google.com" style="position:fixed; left:250px; top:0; width:calc(100vw - 250px); height:100vh; border:none; z-index:0;"></webview>
    
    <!-- L'UI : Positionnée au premier plan -->
    <div id="root" style="position:relative; z-index:10;"></div>
    
    <script type="text/babel" src="./src/App.js"></script>
  </body>
</html>
