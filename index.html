<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body { background: transparent !important; margin: 0; overflow: hidden; }
      .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); }
      #browser-view {
        position: absolute;
        right: 0;
        top: 0;
        width: calc(100vw - 250px);
        height: 100vh;
        border: none;
        z-index: 1;
      }
    </style>
    <title>Modern Browser</title>
  </head>
  <body class="bg-transparent">
    <div id="root" class="relative z-10"></div>
    <webview id="browser-view" src="https://www.google.com"></webview>
    <script type="text/babel" src="./src/App.js"></script>
  </body>
</html>
